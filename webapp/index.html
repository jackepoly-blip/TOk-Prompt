<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scene Generator Prompts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #fafafa;
      --border: #e6e6e6;
      --text: #1f2328;
      --muted: #6b6f76;
      --accent: #2b6cb0;
      --card: #ffffff;
      --shadow: 0 1px 3px rgba(15, 17, 21, 0.06), 0 1px 2px rgba(15, 17, 21, 0.04);
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 28px 24px 72px; }
    header.page-header { border-bottom: 1px solid var(--border); margin-bottom: 28px; padding-bottom: 18px; }
    header.page-header h1 { margin: 0 0 6px; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
    header.page-header p { margin: 4px 0; color: var(--muted); font-size: 14px; }
    .search-row { display: flex; gap: 10px; align-items: center; margin: 18px 0 8px; }
    .search-row input {
      flex: 1; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-family: inherit;
      background: var(--bg-alt); color: var(--text); outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .search-row input:focus { border-color: var(--accent); background: #fff; }
    .search-row .count { color: var(--muted); font-size: 13px; }

    .category-header { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 28px 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(15, 17, 21, 0.08); border-color: #d0d7de; }
    .card .thumb { width: 100%; aspect-ratio: 16 / 9; background: #f2f4f7; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .thumb.meta { background: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 100%); color: #6b21a8; font-weight: 600; font-size: 14px; letter-spacing: 0.02em; }
    .card .body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; }
    .card .badge { display: inline-block; font-size: 11px; font-weight: 600; color: #6b21a8; background: #f3e8ff; padding: 3px 8px; border-radius: 999px; margin-bottom: 8px; width: fit-content; }
    .card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; line-height: 1.35; }
    .card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }

    /* Detail view */
    .detail-wrap { max-width: 820px; margin: 0 auto; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-bottom: 14px; padding: 6px 10px; margin-left: -10px; border-radius: 6px; }
    .back-link:hover { background: var(--bg-alt); text-decoration: none; color: var(--text); }
    .detail h1 { font-size: 32px; font-weight: 700; margin: 4px 0 14px; line-height: 1.2; letter-spacing: -0.01em; }
    .detail .meta-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .detail .meta-row strong { color: var(--text); font-weight: 600; }
    .detail .quick { font-size: 15px; color: var(--text); margin: 14px 0 24px; }
    .detail .images { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 24px 0; }
    .detail .images.multi { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .detail .images img { width: 100%; border-radius: var(--radius); border: 1px solid var(--border); display: block; cursor: zoom-in; background: #fff; }
    .detail pre.prompt { white-space: pre-wrap; word-wrap: break-word; font-family: 'Inter', sans-serif; font-size: 14.5px; line-height: 1.65; background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; margin: 8px 0 16px; color: var(--text); }
    .detail .copy-row { display: flex; justify-content: flex-end; margin-top: -6px; margin-bottom: 6px; }
    .detail .copy-btn { font: inherit; font-size: 13px; color: var(--text); background: #fff; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .detail .copy-btn:hover { background: var(--bg-alt); }
    .detail .source { font-size: 13px; color: var(--muted); margin-top: 20px; }
    .section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 18px 0 8px; }

    .lightbox { position: fixed; inset: 0; background: rgba(15, 17, 21, 0.88); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; cursor: zoom-out; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }

    @media (max-width: 600px) {
      .shell { padding: 20px 16px 48px; }
      .detail h1 { font-size: 24px; }
      header.page-header h1 { font-size: 22px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="app"></div>
  </div>
  <div class="lightbox" id="lightbox"><img id="lightbox-img" alt="" /></div>

  <script>
    let PROMPTS = [];
    const app = document.getElementById('app');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.classList.remove('open'); });

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('open');
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function isMeta(card) {
      return card.category === 'Tools' || /^META PROMPT/i.test(card.title);
    }

    function slug(s) {
      return String(s).replace(/[^a-zA-Z0-9]+/g, '-').replace(/(^-|-$)/g, '').toLowerCase();
    }

    function findCardBySlug(s) {
      return PROMPTS.find(p => slug(p.title) === s);
    }

    function renderIndex(query) {
      const q = (query || '').trim().toLowerCase();
      const filtered = q
        ? PROMPTS.filter(p =>
            p.title.toLowerCase().includes(q) ||
            (p.category || '').toLowerCase().includes(q) ||
            (p.quick_description || '').toLowerCase().includes(q) ||
            (p.full_text || '').toLowerCase().includes(q))
        : PROMPTS;

      // group by category preserving source order
      const order = [];
      const groups = {};
      filtered.forEach(p => {
        const cat = p.category || 'Uncategorized';
        if (!(cat in groups)) { groups[cat] = []; order.push(cat); }
        groups[cat].push(p);
      });

      const catHtml = order.map(cat => {
        const cardsHtml = groups[cat].map(p => {
          const thumb = p.images && p.images.length > 0
            ? `<div class="thumb"><img src="../prompts/images/${escapeHtml(p.images[0].file)}" alt="${escapeHtml(p.title)}" loading="lazy" /></div>`
            : `<div class="thumb meta">${isMeta(p) ? 'META PROMPT' : ''}</div>`;
          return `
            <div class="card" data-slug="${escapeHtml(slug(p.title))}">
              ${thumb}
              <div class="body">
                <span class="badge">${escapeHtml(p.category || '')}</span>
                <h3>${escapeHtml(p.title)}</h3>
                <p>${escapeHtml(p.quick_description || '')}</p>
              </div>
            </div>`;
        }).join('');
        return `<div class="category-header">${escapeHtml(cat)}</div><div class="grid">${cardsHtml}</div>`;
      }).join('');

      app.innerHTML = `
        <header class="page-header">
          <h1>Scene Generator Prompts</h1>
          <p>A cloned archive of the Scene Generator Prompts collection. Each page preserves the original text and images verbatim.</p>
          <p>Source: <a href="https://designhacker.notion.site/2808ee976d0c804cbac4cc7ab9c33de4" target="_blank" rel="noopener">designhacker.notion.site</a></p>
          <div class="search-row">
            <input id="search" type="text" placeholder="Search prompts by title, category, or description…" value="${escapeHtml(q)}" />
            <span class="count">${filtered.length} of ${PROMPTS.length}</span>
          </div>
        </header>
        ${filtered.length === 0 ? '<p style="color:var(--muted);">No prompts match your search.</p>' : catHtml}
      `;

      document.getElementById('search').addEventListener('input', (e) => {
        renderIndex(e.target.value);
        document.getElementById('search').focus();
      });
      app.querySelectorAll('.card').forEach(el => {
        el.addEventListener('click', () => {
          const s = el.getAttribute('data-slug');
          location.hash = '#/' + s;
        });
      });
    }

    function renderDetail(s) {
      const card = findCardBySlug(s);
      if (!card) { location.hash = ''; return; }

      const imgsHtml = (card.images && card.images.length > 0)
        ? `<div class="images ${card.images.length > 1 ? 'multi' : ''}">
             ${card.images.map(im => `<img src="../prompts/images/${escapeHtml(im.file)}" alt="${escapeHtml(card.title)}" loading="lazy" data-full="../prompts/images/${escapeHtml(im.file)}" />`).join('')}
           </div>`
        : '';

      app.innerHTML = `
        <div class="detail-wrap detail">
          <a href="#" class="back-link">← Back to all prompts</a>
          <h1>${escapeHtml(card.title)}</h1>
          <div class="meta-row">
            ${card.category ? `<span><strong>Category:</strong> ${escapeHtml(card.category)}</span>` : ''}
          </div>
          ${card.quick_description ? `<p class="quick">${escapeHtml(card.quick_description)}</p>` : ''}
          ${imgsHtml}
          <div class="section-title">Prompt</div>
          <div class="copy-row"><button class="copy-btn" id="copy-btn">Copy prompt text</button></div>
          <pre class="prompt" id="prompt-text">${escapeHtml(card.full_text || '')}</pre>
          <p class="source">Original Notion page: <a href="${escapeHtml(card.url)}" target="_blank" rel="noopener">${escapeHtml(card.url)}</a></p>
        </div>
      `;

      app.querySelectorAll('.images img').forEach(img => {
        img.addEventListener('click', () => openLightbox(img.getAttribute('data-full')));
      });
      const copyBtn = document.getElementById('copy-btn');
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(card.full_text || '').then(() => {
          copyBtn.textContent = 'Copied';
          setTimeout(() => { copyBtn.textContent = 'Copy prompt text'; }, 1500);
        });
      });
      window.scrollTo(0, 0);
    }

    function route() {
      const hash = location.hash.replace(/^#\/?/, '');
      if (hash) renderDetail(hash);
      else renderIndex('');
    }

    window.addEventListener('hashchange', route);

    fetch('../data/prompts.json', { cache: 'no-store' })
      .then(r => r.json())
      .then(data => {
        PROMPTS = data;
        route();
      })
      .catch(err => {
        app.innerHTML = `<p style="color:#c00">Failed to load prompts: ${escapeHtml(String(err))}</p>`;
      });
  </script>
</body>
</html>
